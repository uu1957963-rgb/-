name: Build Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean package
          else
            cd MinervaCore && mvn clean package
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MinervaCore-JAR
          path: '**/target/*.jar'
